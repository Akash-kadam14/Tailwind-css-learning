<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiple Cards</title>
    <link rel="stylesheet" href="../output.css" />
  </head>
  <body class="bg-grey-100 p-10">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div
        class="bg-white p-5 rounded-xl shadow-lg hover:shadow-2xl hover:scale-105 transition duration-300"
      >
        <h1 class="text-xl font-bold">Node js</h1>
        <p class="mt-2 text-grey-500">Backend Development</p>
      </div>
      <div
        class="bg-white p-5 rounded-xl shadow-lg hover:shadow-2xl hover:scale-105 transition duration-300"
      >
        <h2 class="text-xl font-bold">React</h2>
        <p class="mt-2 text-gray-500">Frontend Development</p>
      </div>
      <div
        class="bg-white p-5 rounded-xl shadow-lg hover:scale-105 transition duration-300"
      >
        <h2 class="text-xl font-bold">AWS</h2>
        <p class="mt-2 text-gray-500">Cloud Computing</p>
      </div>

      <!-- image cards -->
      <div class="bg-white rounded-xl shadow-lg overflow-hidden p-10">
        <img src="https://picsum.photos/400/200" alt="" />
        <div class="p-5">
          <h2 class="text-xl font-bold">Tailwind css</h2>
          <p class="text-gray-500 mt-2">Utility first css</p>
        </div>
      </div>
    </div>
  </body>
</html>
