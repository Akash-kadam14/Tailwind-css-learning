<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../output.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <title>Card system</title>
  </head>
  <body class="flex justify-center items-center m-20 bg-black">
    <div
      class="w-100 h-150 border bg-black text-white rounded-3xl shadow-2xl border border-gray-700"
    >
      <div class="flex flex-col items-center">
        <img
          class="w-70 h-70 rounded-full object-cover mt-4"
          src="https://www.hondaireland.ie/assets/2024/02/458660_24YM_CBR650R-640x425.jpg"
          alt=""
        />
      </div>
      <div class="flex flex-col m-2">
        <h3 class="font-bold text-lg">Akash Kadam</h3>
        <h5 class="text-base text-gray-500">Akash-kadam14</h5>
        <p class="text-sm">
          >Node Js Developer <br />
          >Software Engineer <br />
          >AWS<br />
          >React
        </p>

        <button
          class="mt-1 border border-gray-600 rounded-md text-white hover:bg-gray-800 transition-colors cursor-pointer"
        >
          Edit Profile
        </button>
      </div>
      <div class="flex flex-col justify-between p-2">
        <div class="flex items-center gap-2">
          <i data-lucide="users" class="w-4 h-4"></i>
          <span>3 followers · 4 following</span>
        </div>
        <div class="flex items-center gap-2">
          <i data-lucide="building" class="w-4 h-4"></i>
          <h3>Amazon</h3>
        </div>
        <div class="flex items-center gap-2">
          <i data-lucide="clock-4" class="w-4 h-4"></i>
          <h3>5:00 <span class="text-sm text-gray-400">(UTC - 12:00)</span></h3>
        </div>
        <div class="flex items-center gap-2">
          <i data-lucide="link" class="w-4 h-4"></i>
          <a href="https://www.linkedin.com/in/akashkadam1427/">LinkedIn</a>
        </div>
      </div>
    </div>

    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
